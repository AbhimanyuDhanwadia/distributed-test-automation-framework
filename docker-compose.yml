version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: dtaf-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - dtaf-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  controller:
    build: .
    container_name: dtaf-controller
    command: uvicorn src.controller.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dtaf-network
    restart: unless-stopped

  worker:
    build: .
    command: python -m src.worker.main
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - controller
      - redis
    networks:
      - dtaf-network
    restart: unless-stopped
    deploy:
      replicas: 3

networks:
  dtaf-network:
    driver: bridge

volumes:
  redis-data:
